[package]
name = "backend"
version = "0.1.0"

[build]
outputDir = "src/backend/dist"
args = [ "--release" ]
check-wasm = true
check-deploy = true

[canisters.backend]
main = "src/backend/main.mo"

[canisters.backend.check-stable]
path = "src/backend/dist/backend.most"

[canisters.backend.migrations]
chain = "src/backend/migrations"
check-limit = 1

[toolchain]
moc = "1.16.0"
lintoko = "0.12.0"

[lint]
extends = true

[moc]
args = [ "-E=M0254", "-W=M0235,M0223,M0236,M0237", "-A=M0241", "--default-persistent-actors", "--implicit-package=core", "-no-check-ir", "--generate-view-queries" ]

[dependencies]
core = "2.6.2"
caffeineai-data-viewer = "0.1.0"
caffeineai-object-storage = "1.1.1"
caffeineai-stripe = "./src/backend/vendor/caffeineai-stripe"
caffeineai-oql = "0.4.0"
sha2 = "0.2.5"
ic = "4.2.0"
caffeineai-http-outcalls = "0.1.4"

[dev-dependencies]
test = "2.1.2"
